[project]
name = "support-ticket-agent-v0"
version = "0.1.0"
description = "Baseline support-ticket agent for demonstrating harness, graph, and loop engineering."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "google-genai",
    "langgraph>=1.2.11",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
